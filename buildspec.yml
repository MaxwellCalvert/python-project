version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 12
      python: 3.9
  pre_build:
    commands:
      - echo Test the python application.
      - export PYTHONPATH=$PYTHONPATH:$(pwd)
      - pip install "Werkzeug<3.0"
      - pip install -r requirements.txt
      - pip install -U pytest
      - pytest
  build:
    commands:
      - echo Build the CSS using less.
      - mkdir -p static/css
      - npm install less
      - node compile-less.js

artifacts:
  files:
    - '**/*'
  name: python-app-$(date +%y%m%d%H%M).zip
